spring.application.name=That Was Great
spring.main.web-application-type=none

database.driverClassName=org.sqlite.JDBC
database.url=jdbc:sqlite:data/thatwasgreat.db
database.username=sa
database.password=sa
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

application.title=That Was Great
application.window.width=1920
application.window.height=1080